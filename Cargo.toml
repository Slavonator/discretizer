[package]
name = "discretizer"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dev-dependencies]
image = "0.25"
imageproc = "0.25"
rusttype = "0.9"
ab_glyph = "0.2"
terminal_size = "0.4"
crossterm = "0.28"
glam = "0.34.1"
tobj = "4"

[[example]]
name = "pipeline"
path = "examples/readme_images/pipeline_diagram.rs"

[[example]]
name = "plane-viewport"
path = "examples/readme_images/plane_view.rs"

[[example]]
name = "multiple-viewports"
path = "examples/readme_images/multiple_views.rs"

[[example]]
name = "ascii-image-viewer"
path = "examples/image_viewers/ascii_image_viewer.rs"

[[example]]
name = "8color-ascii-image-viewer"
path = "examples/image_viewers/8color_ascii_image_viewer.rs"

[[example]]
name = "ascii-video-viewer"
path = "examples/video_viewers/ascii_video_viewer.rs"

[[example]]
name = "8color-ascii-video-viewer"
path = "examples/video_viewers/8color_ascii_video_viewer.rs"

